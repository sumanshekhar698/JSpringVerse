spring.application.name=SpringBoot-AI

# =====================================================================================
# SERVER
# =====================================================================================
# Not 8080: another local JVM already holds it. Override per-run with SERVER_PORT.
server.port=${SERVER_PORT:8081}

# =====================================================================================
# SECRETS
# =====================================================================================
# Never commit a key here. Set it in the environment before starting the app:
#   PowerShell:  $env:OPENAI_API_KEY = "sk-..."
#   bash:        export OPENAI_API_KEY="sk-..."
# The app fails fast on startup if it is missing, rather than at the first request.

# =====================================================================================
# CHAT MODELS
# =====================================================================================
# spring.ai.openai.chat.options.model is deprecated in Spring AI 2.0 in favour of this.
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5-mini}

# Local model, used by /ai/ollama/chat. Requires a running Ollama daemon.
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:qwen3.5:latest}
# Do not let Ollama pull multi-GB models implicitly on startup.
spring.ai.ollama.init.pull-model-strategy=never

# =====================================================================================
# EMBEDDINGS  (switchable: see application-embed-openai / application-embed-ollama)
# =====================================================================================
# Selects which EmbeddingModel is auto-configured. With both the OpenAI and Ollama
# starters on the classpath there would otherwise be two candidate beans.
# Activate a profile to switch:  --spring.profiles.active=embed-ollama
spring.profiles.default=embed-openai

# =====================================================================================
# POSTGRES + PGVECTOR
# =====================================================================================
# Port 5433 is the pgvector Docker container (pgvector/pgvector:pg18), not the local
# PostgreSQL 18 install on 5432. The local server has no pgvector extension available and
# there is no Windows installer for it, so the container is where the vector tables live.
#   docker run -d --name pgvector -e POSTGRES_PASSWORD=... -p 5433:5432 pgvector/pgvector:pg18
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5433/jspringverse}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:suman}
spring.datasource.hikari.maximum-pool-size=10

# Liquibase owns every table, including the pgvector ones. See db/changelog/.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Spring AI must NOT create tables — Liquibase already did. schema-validation stays on so
# the app refuses to start if the changelog and the configured dimensions ever disagree,
# which is the failure that would otherwise surface as a confusing runtime insert error.
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.vectorstore.pgvector.index-type=hnsw
# Cosine distance is the right metric for the normalized embeddings both providers return.
spring.ai.vectorstore.pgvector.distance-type=cosine-distance
# Chunks are written in batches by the ingestion service; this is the store-level ceiling.
spring.ai.vectorstore.pgvector.max-document-batch-size=1000

# =====================================================================================
# FILING INGESTION
# =====================================================================================
# A full 10-K PDF is commonly 5-15 MB; the 1 MB Spring default rejects them outright.
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB

jspringverse.rag.chunk-size-tokens=800
jspringverse.rag.min-chunk-size-chars=500
jspringverse.rag.min-chunk-length-to-embed=50
jspringverse.rag.embedding-batch-size=100
jspringverse.rag.top-k=5
# Below this cosine similarity a chunk is treated as irrelevant and dropped, so an
# off-topic question returns nothing instead of the least-bad chunk in the corpus.
#
# CALIBRATED against Apple's FY2025 10-K with text-embedding-3-small — do not raise this on
# intuition. Measured top scores:
#   "supply chain risks and supplier concentration" -> 0.478   (relevant)
#   "revenue by segment and gross margin"           -> 0.462   (relevant)
#   "the weather in Paris tomorrow"                 -> 0.143   (noise)
#   "how to bake sourdough bread"                   -> 0.072   (noise)
# Usable band is ~0.14 to ~0.38; 0.28 sits in the middle. A previous value of 0.55 was above
# every achievable score and returned zero hits for every question.
# Re-measure with GET /api/filings/search after changing model, chunk size or corpus.
jspringverse.rag.similarity-threshold=0.28

# =====================================================================================
# MARKET DATA
# =====================================================================================
jspringverse.market.provider=yahoo
jspringverse.market.yahoo-base-url=https://query1.finance.yahoo.com
# Yahoo returns 403 to the default JDK user agent; this header is required, not cosmetic.
jspringverse.market.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) JSpringVerse/1.0
jspringverse.market.timeout=10s
jspringverse.market.quote-cache-ttl=30s
jspringverse.market.max-search-results=10

# =====================================================================================
# CONVERSATION MEMORY
# =====================================================================================
jspringverse.memory.enabled=true
# Messages retained per conversation, counted in MESSAGES not turns. This agent's turns are
# message-heavy: resolving a ticker then quoting it produces a user message, two tool-call
# messages, two tool-result messages and an answer. 40 is roughly a dozen such exchanges.
jspringverse.memory.max-messages=40

# Liquibase creates SPRING_AI_CHAT_MEMORY in changeset 005 — the repository must not also
# try. Two schema initialisers racing on one database is how a deploy ends up half-migrated.
spring.ai.chat.memory.repository.jdbc.initialize-schema=never

# =====================================================================================
# GUARDRAILS
# =====================================================================================
jspringverse.guardrails.enabled=true
jspringverse.guardrails.max-question-length=4000
# Refuse buy/sell/hold and price-prediction requests at the door rather than relying on the
# system prompt to hold.
jspringverse.guardrails.block-investment-advice=true
jspringverse.guardrails.block-prompt-injection=true
jspringverse.guardrails.append-disclaimer=true

# =====================================================================================
# API DOCUMENTATION  (springdoc-openapi 3.x — the Spring Boot 4 line)
# =====================================================================================
# Swagger UI:  http://localhost:8081/swagger-ui.html
# OpenAPI doc: http://localhost:8081/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Group by controller tag rather than the generated class name, and keep the ordering
# stable so a spec diff reflects real changes rather than reflection ordering.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.writer-with-order-by-keys=true
# Actuator endpoints are operational, not part of the public API surface.
springdoc.show-actuator=false
# Turn both off in production: the spec enumerates every endpoint and parameter.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# =====================================================================================
# OBSERVABILITY
# =====================================================================================
management.endpoints.web.exposure.include=health,info,metrics,liquibase,loggers,env,configprops
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
# Custom indicators: marketData probes the quote feed, filingCorpus reports RAG state.
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# readinessState must stay in the group — dropping it would mean the probe stops reflecting
# Spring's own readiness lifecycle and only reports our two checks.
# marketData is deliberately absent: an unofficial third-party feed being down must not pull
# the instance out of the load balancer while filing Q&A still works.
management.endpoint.health.group.readiness.include=readinessState,db,filingCorpus
management.endpoint.health.group.liveness.include=livenessState
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

info.app.name=Stock Research Agent
info.app.description=US equity agent grounded in live market data and SEC filings

# Records token usage and latency per model call as Micrometer metrics.
spring.ai.chat.observations.log-prompt=false

logging.level.dev.codecounty.springai=DEBUG
logging.level.org.springframework.ai=INFO
