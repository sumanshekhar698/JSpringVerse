# Embedding profile: local Ollama nomic-embed-text (768 dimensions).
#
# Activate with:  --spring.profiles.active=embed-ollama
#
# Nothing leaves the machine, which matters if the filings you ingest are confidential
# or pre-release. Requires:  ollama pull nomic-embed-text

spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Separate table from the OpenAI profile: 768-dimension vectors cannot share a column
# with 1536-dimension ones. Switching profiles requires re-ingesting the filings.
spring.ai.vectorstore.pgvector.table-name=filing_vectors_ollama
spring.ai.vectorstore.pgvector.dimensions=768

# Local embedding is slower per call; a smaller batch keeps memory flat and makes
# progress visible in the logs during a long ingest.
jspringverse.rag.embedding-batch-size=32
