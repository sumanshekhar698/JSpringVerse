# Embedding profile: OpenAI text-embedding-3-small (1536 dimensions).
#
# Activate with:  --spring.profiles.active=embed-openai   (this is the default)
#
# Cost reference: roughly $0.02 per 1M tokens. A full 10-K is ~150k tokens, so
# ingesting one annual report costs well under a cent.

spring.ai.model.embedding=openai
spring.ai.openai.embedding.options.model=text-embedding-3-small

# The pgvector column dimension is fixed when the table is created, so each embedding
# model needs its own table. Switching profiles therefore never mixes incompatible
# vectors — it points at a different table that must be ingested separately.
spring.ai.vectorstore.pgvector.table-name=filing_vectors_openai
spring.ai.vectorstore.pgvector.dimensions=1536
